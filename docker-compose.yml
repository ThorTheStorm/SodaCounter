version: "3.8"

services:
  postgres:
    image: ncr.sky.nhn.no/dockerhub/postgres:15
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpasss
      POSTGRES_DB: thedb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  
  pgadmin:
    image: ncr.sky.nhn.no/dockerhub/dpage/pgadmin4
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: tor.egil@tbhome.no
      PGADMIN_DEFAULT_PASSWORD: strong-password
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  minio:
    image: ncr.sky.nhn.no/dockerhub/minio/minio:latest
    environment:
      MINIO_ROOT_USER: devuser
      MINIO_ROOT_PASSWORD: devpasss
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data

  rabbitmq:
    image: ncr.sky.nhn.no/dockerhub/rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: devuser
      RABBITMQ_DEFAULT_PASS: devpasss
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  vault:
    image: ncr.sky.nhn.no/dockerhub/hashicorp/vault:1.14.0
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: devpasss
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    command: "server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200"
    volumes:
      - vault-data:/vault/file

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED="true"
      - MEMORY_MAX_TRACES=100000
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver

volumes:
  postgres-data:
  pgadmin-data:
  minio-data:
  rabbitmq-data:
  vault-data: